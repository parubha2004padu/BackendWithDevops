services:

  backend:
    build: .
    container_name: backend-compose
    ports:
      - "8080:8080"
    depends_on:
      - mysql-backend

  mysql-backend:
    image: mysql:latest
    container_name: mysql-compose
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: backenddevops
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: